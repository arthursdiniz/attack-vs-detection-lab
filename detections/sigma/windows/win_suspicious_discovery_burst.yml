title: Suspicious Rapid Sequence of Discovery Commands
id: e8912b43-9182-4f81-a281-9b18274a9192
status: test
description: Detects a rapid succession of native Windows discovery and reconnaissance commands (whoami, net, ipconfig, netstat, tasklist, systeminfo) executed within a short timeframe, characteristic of adversary situational awareness enumeration following initial access.
references:
  - https://attack.mitre.org/techniques/T1082/
  - https://attack.mitre.org/techniques/T1087/001/
  - https://attack.mitre.org/techniques/T1016/
author: Senior Detection Engineer (DetectLab)
date: 2026/10/05
tags:
  - attack.discovery
  - attack.t1082
  - attack.t1087.001
  - attack.t1016
  - attack.t1049
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\whoami.exe'
      - '\systeminfo.exe'
      - '\ipconfig.exe'
      - '\netstat.exe'
      - '\route.exe'
      - '\tasklist.exe'
      - '\nltest.exe'
      - '\quser.exe'
      - '\qwinsta.exe'
  condition: selection | count() by Computer >= 5
  timeframe: 30s
falsepositives:
  - IT support troubleshooting scripts collecting diagnostic information.
  - Endpoint management tools (e.g. Tanium, SCCM) running periodic hardware audits.
level: medium
