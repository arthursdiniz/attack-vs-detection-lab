<!--
  Attack vs Detection Lab - Wazuh Agent Reference Configuration
  Platform: Windows 11 Enterprise (64-bit)
  Target Manager: 192.168.56.40
  Author: Senior Security & Detection Engineer
-->
<ossec_config>
  <client>
    <server>
      <address>192.168.56.40</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <client_buffer>
    <!-- In-memory buffer to prevent event loss during manager restarts -->
    <disabled>no</disabled>
    <queue_size>50000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- ================================================================= -->
  <!-- WINDOWS EVENT CHANNELS TELEMETRY                                  -->
  <!-- ================================================================= -->

  <!-- 1. Native Windows Security Event Log (Logon 4625/4624, Users 4720/4728) -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- 2. Microsoft Sysmon Operational Channel (Process, Network, File, Reg) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- 3. PowerShell Operational Channel (Script Block Logging EID 4104) -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- 4. Windows System Event Log (Service installations EID 7045) -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- ================================================================= -->
  <!-- FILE INTEGRITY MONITORING (FIM / SYSCHECK)                        -->
  <!-- ================================================================= -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    
    <!-- Monitor critical Windows system hosts file and staging locations -->
    <directories check_all="yes" realtime="yes">C:\Windows\System32\drivers\etc</directories>
    <directories check_all="yes" realtime="yes">C:\LabStaging</directories>
    
    <ignore>C:\Windows\System32\LogFiles</ignore>
    <ignore type="sregex">.log$|.tmp$</ignore>
  </syscheck>
</ossec_config>
