<!--
  Attack vs Detection Lab - Wazuh Agent Reference Configuration
  Platform: Ubuntu Server 22.04 LTS (64-bit)
  Target Manager: 192.168.56.40
  Author: Senior Security & Detection Engineer
-->
<ossec_config>
  <client>
    <server>
      <address>192.168.56.40</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>50000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- ================================================================= -->
  <!-- LINUX LOG SOURCES INGESTION                                       -->
  <!-- ================================================================= -->

  <!-- 1. System Authentication Log (SSH, sudo, PAM) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- 2. Linux Auditd Log Stream (Kernel syscalls, execve, file rules) -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- 3. General System Message Log -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- 4. Package Management Audit (T1072 / Software deployment) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

  <!-- ================================================================= -->
  <!-- FILE INTEGRITY MONITORING (FIM / SYSCHECK)                        -->
  <!-- ================================================================= -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    
    <!-- Real-time monitoring of identity and authentication files (INC-004) -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/passwd</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/shadow</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/group</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/gshadow</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/sudoers</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/ssh/sshd_config</directories>
    <directories check_all="yes" realtime="yes">/etc/crontab</directories>

    <!-- Noise exclusions -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore type="sregex">.log$|.tmp$</ignore>
  </syscheck>
</ossec_config>
